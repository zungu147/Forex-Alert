name: Build Forex Alert

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/forexalert/app
          mkdir -p app/src/main/res/values


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ForexAlert"

          include ':app'
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {

              namespace 'com.forexalert.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.forexalert.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 3

                  versionName '1.2.0'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {

                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />


              <application

                  android:theme="@style/AppTheme"

                  android:label="@string/app_name"

                  android:allowBackup="true"

                  android:supportsRtl="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".ForexAlertService"

                      android:exported="false"

                      android:foregroundServiceType="specialUse">

                      <property

                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"

                          android:value="Continuous real-time Forex market price monitoring for user-created price alerts." />

                  </service>


              </application>

          </manifest>
          EOF


          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">Forex Alert</string>

          </resources>
          EOF


          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/java/com/forexalert/app/ForexAlertService.kt <<'EOF'
          package com.forexalert.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.graphics.Color
          import android.media.RingtoneManager
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs


          class ForexAlertService : Service() {

              companion object {

                  const val ACTION_SYMBOL_CHANGED =
                      "com.forexalert.app.SYMBOL_CHANGED"

                  const val ACTION_PRICE_UPDATE =
                      "com.forexalert.app.PRICE_UPDATE"

                  const val ACTION_ALERT_UPDATE =
                      "com.forexalert.app.ALERT_UPDATE"

                  const val EXTRA_SYMBOL =
                      "symbol"

                  const val EXTRA_PRICE =
                      "price"

                  private const val CHANNEL_ID =
                      "forex_monitoring"

                  private const val ALERT_CHANNEL_ID =
                      "forex_alerts"

                  private const val FOREGROUND_ID =
                      5001
              }


              private val preferences by lazy {

                  getSharedPreferences(
                      "forex_alert_preferences",
                      MODE_PRIVATE
                  )
              }


              private val client =
                  OkHttpClient.Builder()

                      .connectTimeout(
                          15,
                          TimeUnit.SECONDS
                      )

                      .readTimeout(
                          0,
                          TimeUnit.MILLISECONDS
                      )

                      .writeTimeout(
                          15,
                          TimeUnit.SECONDS
                      )

                      .pingInterval(
                          30,
                          TimeUnit.SECONDS
                      )

                      .build()


              private var webSocket: WebSocket? = null


              private var currentSymbol =
                  "frxEURUSD"


              /*
               * Service lifecycle flag.
               *
               * This replaces Activity.isDestroyed,
               * which is not available inside Service.
               */

              @Volatile
              private var serviceRunning =
                  false


              override fun onCreate() {

                  super.onCreate()

                  serviceRunning = true

                  createNotificationChannels()

                  startMonitoringNotification()

                  currentSymbol =
                      preferences.getString(
                          "selected_symbol",
                          "frxEURUSD"
                      ) ?: "frxEURUSD"

                  connect()
              }


              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {

                  if (
                      intent?.action ==
                      ACTION_SYMBOL_CHANGED
                  ) {

                      val newSymbol =
                          intent.getStringExtra(
                              EXTRA_SYMBOL
                          )


                      if (
                          !newSymbol.isNullOrEmpty() &&
                          newSymbol != currentSymbol
                      ) {

                          currentSymbol =
                              newSymbol


                          webSocket?.close(
                              1000,
                              "Changing symbol"
                          )


                          connect()
                      }
                  }


                  return START_STICKY
              }


              private fun startMonitoringNotification() {

                  val intent =
                      Intent(
                          this,
                          MainActivity::class.java
                      )


                  val pendingIntent =
                      PendingIntent.getActivity(
                          this,
                          7000,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or
                              PendingIntent.FLAG_IMMUTABLE
                      )


                  val notification =
                      Notification.Builder(
                          this,
                          CHANNEL_ID
                      )

                          .setSmallIcon(
                              android.R.drawable.ic_popup_sync
                          )

                          .setContentTitle(
                              "Forex Alert"
                          )

                          .setContentText(
                              "Monitoring Forex price alerts"
                          )

                          .setContentIntent(
                              pendingIntent
                          )

                          .setOngoing(true)

                          .setShowWhen(false)

                          .setColor(
                              Color.rgb(
                                  0,
                                  120,
                                  215
                              )
                          )

                          .build()


                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.Q
                  ) {

                      startForeground(
                          FOREGROUND_ID,
                          notification,
                          android.content.pm.ServiceInfo
                              .FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )

                  } else {

                      startForeground(
                          FOREGROUND_ID,
                          notification
                      )
                  }
              }


              private fun connect() {

                  if (!serviceRunning) {
                      return
                  }


                  val request =
                      Request.Builder()

                          .url(
                              "wss://ws.binaryws.com/websockets/v3"
                          )

                          .build()


                  webSocket =
                      client.newWebSocket(
                          request,
                          object :
                              WebSocketListener() {


                              override fun onOpen(
                                  webSocket: WebSocket,
                                  response: Response
                              ) {

                                  subscribe()
                              }


                              override fun onMessage(
                                  webSocket: WebSocket,
                                  text: String
                              ) {

                                  processMessage(
                                      text
                                  )
                              }


                              override fun onFailure(
                                  webSocket: WebSocket,
                                  t: Throwable,
                                  response: Response?
                              ) {

                                  reconnectLater()
                              }


                              override fun onClosed(
                                  webSocket: WebSocket,
                                  code: Int,
                                  reason: String
                              ) {

                                  if (
                                      code != 1000
                                  ) {

                                      reconnectLater()
                                  }
                              }
                          }
                      )
              }


              private fun reconnectLater() {

                  Thread {

                      try {

                          Thread.sleep(
                              5000
                          )

                      } catch (
                          _: InterruptedException
                      ) {
                      }


                      if (
                          serviceRunning
                      ) {

                          connect()
                      }

                  }.start()
              }


              private fun subscribe() {

                  val request =
                      JSONObject()


                  request.put(
                      "ticks",
                      currentSymbol
                  )


                  request.put(
                      "subscribe",
                      1
                  )


                  webSocket?.send(
                      request.toString()
                  )
              }


              private fun processMessage(
                  message: String
              ) {

                  try {

                      val json =
                          JSONObject(
                              message
                          )


                      if (
                          json.has("error")
                      ) {
                          return
                      }


                      if (
                          json.optString(
                              "msg_type"
                          ) != "tick"
                      ) {
                          return
                      }


                      val tick =
                          json.optJSONObject(
                              "tick"
                          ) ?: return


                      val symbol =
                          tick.optString(
                              "symbol"
                          )


                      if (
                          symbol != currentSymbol
                      ) {
                          return
                      }


                      val price =
                          tick.optDouble(
                              "quote",
                              Double.NaN
                          )


                      if (
                          !price.isFinite()
                      ) {
                          return
                      }


                      sendPriceUpdate(
                          symbol,
                          price
                      )


                      checkAlerts(
                          symbol,
                          price
                      )

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun sendPriceUpdate(
                  symbol: String,
                  price: Double
              ) {

                  val intent =
                      Intent(
                          ACTION_PRICE_UPDATE
                      )


                  intent.setPackage(
                      packageName
                  )


                  intent.putExtra(
                      EXTRA_SYMBOL,
                      symbol
                  )


                  intent.putExtra(
                      EXTRA_PRICE,
                      price
                  )


                  sendBroadcast(
                      intent
                  )
              }


              private fun checkAlerts(
                  symbol: String,
                  price: Double
              ) {

                  val saved =
                      preferences.getString(
                          "alerts",
                          null
                      ) ?: return


                  try {

                      val array =
                          JSONArray(
                              saved
                          )


                      var changed =
                          false


                      for (
                          i in 0 until array.length()
                      ) {

                          val item =
                              array.getJSONObject(
                                  i
                              )


                          if (
                              item.optString(
                                  "symbol"
                              ) != symbol
                          ) {
                              continue
                          }


                          if (
                              !item.optBoolean(
                                  "enabled",
                                  false
                              )
                          ) {
                              continue
                          }


                          if (
                              item.optBoolean(
                                  "triggered",
                                  false
                              )
                          ) {
                              continue
                          }


                          val condition =
                              item.optString(
                                  "condition"
                              )


                          val target =
                              item.optDouble(
                                  "target",
                                  Double.NaN
                              )


                          if (
                              !target.isFinite()
                          ) {
                              continue
                          }


                          val triggered =
                              when (
                                  condition
                              ) {

                                  "Above" ->
                                      price >= target

                                  "Below" ->
                                      price <= target

                                  "Touch" ->
                                      abs(
                                          price - target
                                      ) <=
                                          touchTolerance(
                                              symbol
                                          )

                                  else ->
                                      false
                              }


                          if (
                              !triggered
                          ) {
                              continue
                          }


                          val triggerTime =
                              System.currentTimeMillis()


                          item.put(
                              "triggered",
                              true
                          )


                          item.put(
                              "triggeredPrice",
                              price
                          )


                          item.put(
                              "triggeredTime",
                              triggerTime
                          )


                          addHistory(
                              item,
                              price,
                              triggerTime
                          )


                          showAlertNotification(
                              item,
                              price
                          )


                          changed =
                              true
                      }


                      if (
                          changed
                      ) {

                          preferences.edit()

                              .putString(
                                  "alerts",
                                  array.toString()
                              )

                              .apply()


                          val updateIntent =
                              Intent(
                                  ACTION_ALERT_UPDATE
                              )


                          updateIntent.setPackage(
                              packageName
                          )


                          sendBroadcast(
                              updateIntent
                          )
                      }

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun addHistory(
                  alert: JSONObject,
                  price: Double,
                  time: Long
              ) {

                  try {

                      val saved =
                          preferences.getString(
                              "history",
                              null
                          )


                      val array =
                          if (
                              saved.isNullOrEmpty()
                          ) {

                              JSONArray()

                          } else {

                              JSONArray(
                                  saved
                              )
                          }


                      val history =
                          JSONObject()


                      history.put(
                          "id",
                          alert.optLong(
                              "id"
                          )
                      )


                      history.put(
                          "symbol",
                          alert.optString(
                              "symbol"
                          )
                      )


                      history.put(
                          "condition",
                          alert.optString(
                              "condition"
                          )
                      )


                      history.put(
                          "target",
                          alert.optDouble(
                              "target"
                          )
                      )


                      history.put(
                          "triggeredPrice",
                          price
                      )


                      history.put(
                          "triggeredTime",
                          time
                      )


                      array.put(
                          history
                      )


                      preferences.edit()

                          .putString(
                              "history",
                              array.toString()
                          )

                          .apply()

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun showAlertNotification(
                  alert: JSONObject,
                  price: Double
              ) {

                  val manager =
                      getSystemService(
                          NOTIFICATION_SERVICE
                      ) as NotificationManager


                  val intent =
                      Intent(
                          this,
                          MainActivity::class.java
                      )


                  val pendingIntent =
                      PendingIntent.getActivity(
                          this,
                          alert.optLong(
                              "id"
                          ).toInt(),
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or
                              PendingIntent.FLAG_IMMUTABLE
                      )


                  val symbolCode =
                      alert.optString(
                          "symbol"
                      )


                  val symbol =
                      displaySymbol(
                          symbolCode
                      )


                  val condition =
                      alert.optString(
                          "condition"
                      )


                  val target =
                      alert.optDouble(
                          "target"
                      )


                  val notification =
                      Notification.Builder(
                          this,
                          ALERT_CHANNEL_ID
                      )

                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )

                          .setContentTitle(
                              "Forex Alert"
                          )

                          .setContentText(
                              "$symbol $condition " +
                              "${formatPrice(target, symbolCode)} — " +
                              "${formatPrice(price, symbolCode)}"
                          )

                          .setContentIntent(
                              pendingIntent
                          )

                          .setAutoCancel(true)

                          .setPriority(
                              Notification.PRIORITY_HIGH
                          )

                          .build()


                  manager.notify(
                      alert.optLong(
                          "id"
                      ).toInt(),
                      notification
                  )
              }


              private fun createNotificationChannels() {

                  val manager =
                      getSystemService(
                          NOTIFICATION_SERVICE
                      ) as NotificationManager


                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      val monitoring =
                          NotificationChannel(
                              CHANNEL_ID,
                              "Forex Monitoring",
                              NotificationManager.IMPORTANCE_LOW
                          )


                      manager.createNotificationChannel(
                          monitoring
                      )


                      val alerts =
                          NotificationChannel(
                              ALERT_CHANNEL_ID,
                              "Forex Alerts",
                              NotificationManager.IMPORTANCE_HIGH
                          )


                      val sound =
                          RingtoneManager.getDefaultUri(
                              RingtoneManager.TYPE_NOTIFICATION
                          )


                      alerts.setSound(
                          sound,
                          android.media.AudioAttributes.Builder()
                              .setUsage(
                                  android.media.AudioAttributes.USAGE_NOTIFICATION
                              )
                              .build()
                      )


                      manager.createNotificationChannel(
                          alerts
                      )
                  }
              }


              private fun touchTolerance(
                  symbol: String
              ): Double {

                  return if (
                      symbol.contains(
                          "JPY"
                      )
                  ) {

                      0.005

                  } else {

                      0.00005
                  }
              }


              private fun displaySymbol(
                  symbol: String
              ): String {

                  return when (
                      symbol
                  ) {

                      "frxEURUSD" ->
                          "EUR/USD"

                      "frxGBPUSD" ->
                          "GBP/USD"

                      "frxUSDJPY" ->
                          "USD/JPY"

                      "frxUSDCHF" ->
                          "USD/CHF"

                      "frxAUDUSD" ->
                          "AUD/USD"

                      "frxUSDCAD" ->
                          "USD/CAD"

                      "frxNZDUSD" ->
                          "NZD/USD"

                      else ->
                          symbol
                  }
              }


              private fun formatPrice(
                  price: Double,
                  symbol: String
              ): String {

                  return if (
                      symbol.contains(
                          "JPY"
                      )
                  ) {

                      String.format(
                          java.util.Locale.US,
                          "%.3f",
                          price
                      )

                  } else {

                      String.format(
                          java.util.Locale.US,
                          "%.5f",
                          price
                      )
                  }
              }


              override fun onBind(
                  intent: Intent?
              ): IBinder? {

                  return null
              }


              override fun onDestroy() {

                  serviceRunning =
                      false


                  webSocket?.close(
                      1000,
                      "Service stopped"
                  )


                  client.dispatcher
                      .executorService
                      .shutdown()


                  super.onDestroy()
              }
          }
          EOF


          cat > app/src/main/java/com/forexalert/app/MainActivity.kt <<'EOF'
          package com.forexalert.app

          import android.Manifest
          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale


          class MainActivity : Activity() {

              private lateinit var priceText: TextView
              private lateinit var statusText: TextView
              private lateinit var alertContainer: LinearLayout
              private lateinit var historyContainer: LinearLayout
              private lateinit var symbolSpinner: Spinner
              private lateinit var targetInput: EditText
              private lateinit var conditionSpinner: Spinner


              private val preferences by lazy {

                  getSharedPreferences(
                      "forex_alert_preferences",
                      Context.MODE_PRIVATE
                  )
              }


              private val alerts =
                  mutableListOf<PriceAlert>()


              private val history =
                  mutableListOf<AlertHistory>()


              private var currentSymbol =
                  "frxEURUSD"


              private var currentPrice =
                  Double.NaN


              private val symbols =
                  linkedMapOf(

                      "EUR/USD" to "frxEURUSD",

                      "GBP/USD" to "frxGBPUSD",

                      "USD/JPY" to "frxUSDJPY",

                      "USD/CHF" to "frxUSDCHF",

                      "AUD/USD" to "frxAUDUSD",

                      "USD/CAD" to "frxUSDCAD",

                      "NZD/USD" to "frxNZDUSD"
                  )


              data class PriceAlert(

                  val id: Long,

                  val symbol: String,

                  val condition: String,

                  val target: Double,

                  var enabled: Boolean,

                  var triggered: Boolean,

                  var triggeredPrice: Double =
                      Double.NaN,

                  var triggeredTime: Long =
                      0L
              )


              data class AlertHistory(

                  val id: Long,

                  val symbol: String,

                  val condition: String,

                  val target: Double,

                  val triggeredPrice: Double,

                  val triggeredTime: Long
              )


              private val receiver =
                  object : BroadcastReceiver() {

                      override fun onReceive(
                          context: Context?,
                          intent: Intent?
                      ) {

                          when (
                              intent?.action
                          ) {

                              ForexAlertService
                                  .ACTION_PRICE_UPDATE -> {

                                  val symbol =
                                      intent.getStringExtra(
                                          ForexAlertService.EXTRA_SYMBOL
                                      ) ?: return


                                  val price =
                                      intent.getDoubleExtra(
                                          ForexAlertService.EXTRA_PRICE,
                                          Double.NaN
                                      )


                                  if (
                                      symbol ==
                                      currentSymbol &&
                                      price.isFinite()
                                  ) {

                                      currentPrice =
                                          price


                                      priceText.text =
                                          formatPrice(
                                              price
                                          )


                                      statusText.text =
                                          "Live"


                                      statusText.setTextColor(
                                          Color.rgb(
                                              0,
                                              150,
                                              0
                                          )
                                      )
                                  }
                              }


                              ForexAlertService
                                  .ACTION_ALERT_UPDATE -> {

                                  loadAlerts()

                                  loadHistory()

                                  refreshAlertList()

                                  refreshHistoryList()
                              }
                          }
                      }
                  }


              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(
                      savedInstanceState
                  )


                  loadAlerts()

                  loadHistory()


                  currentSymbol =
                      preferences.getString(
                          "selected_symbol",
                          "frxEURUSD"
                      ) ?: "frxEURUSD"


                  createInterface()

                  requestNotificationPermission()

                  startMonitoringService()
              }


              override fun onStart() {

                  super.onStart()


                  val filter =
                      IntentFilter().apply {

                          addAction(
                              ForexAlertService
                                  .ACTION_PRICE_UPDATE
                          )

                          addAction(
                              ForexAlertService
                                  .ACTION_ALERT_UPDATE
                          )
                      }


                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      registerReceiver(
                          receiver,
                          filter,
                          RECEIVER_NOT_EXPORTED
                      )

                  } else {

                      registerReceiver(
                          receiver,
                          filter
                      )
                  }


                  loadAlerts()

                  loadHistory()

                  refreshAlertList()

                  refreshHistoryList()
              }


              override fun onStop() {

                  try {

                      unregisterReceiver(
                          receiver
                      )

                  } catch (
                      _: Exception
                  ) {
                  }


                  super.onStop()
              }


              private fun startMonitoringService() {

                  val intent =
                      Intent(
                          this,
                          ForexAlertService::class.java
                      )


                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      startForegroundService(
                          intent
                      )

                  } else {

                      startService(
                          intent
                      )
                  }
              }


              private fun createInterface() {

                  val root =
                      LinearLayout(this)


                  root.orientation =
                      LinearLayout.VERTICAL


                  root.setPadding(
                      24,
                      24,
                      24,
                      24
                  )


                  root.setBackgroundColor(
                      Color.WHITE
                  )



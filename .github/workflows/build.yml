              private fun addAlert() {

                  val text =
                      targetInput.text
                          .toString()
                          .trim()


                  if (
                      text.isEmpty()
                  ) {

                      Toast.makeText(
                          this,
                          "Enter a target price",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }


                  val target =
                      text.toDoubleOrNull()


                  if (
                      target == null ||
                      !target.isFinite() ||
                      target <= 0
                  ) {

                      Toast.makeText(
                          this,
                          "Enter a valid price",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }


                  val condition =
                      conditionSpinner
                          .selectedItem
                          .toString()


                  val alert =
                      PriceAlert(

                          id =
                              System.currentTimeMillis(),

                          symbol =
                              currentSymbol,

                          condition =
                              condition,

                          target =
                              target,

                          enabled =
                              true,

                          triggered =
                              false
                      )


                  alerts.add(
                      alert
                  )


                  saveAlerts()

                  refreshAlertList()

                  targetInput.text.clear()


                  Toast.makeText(
                      this,
                      "Alert added",
                      Toast.LENGTH_SHORT
                  ).show()
              }


              private fun refreshAlertList() {

                  if (
                      !::alertContainer
                          .isInitialized
                  ) {
                      return
                  }


                  alertContainer
                      .removeAllViews()


                  val current =
                      alerts.filter {
                          it.symbol ==
                              currentSymbol
                      }


                  if (
                      current.isEmpty()
                  ) {

                      val empty =
                          TextView(this)


                      empty.text =
                          "No alerts for this pair"


                      empty.textSize =
                          16f


                      empty.setTextColor(
                          Color.GRAY
                      )


                      alertContainer.addView(
                          empty
                      )


                      return
                  }


                  for (
                      alert in current
                  ) {

                      val row =
                          LinearLayout(this)


                      row.orientation =
                          LinearLayout.VERTICAL


                      row.setPadding(
                          12,
                          12,
                          12,
                          12
                      )


                      val description =
                          TextView(this)


                      description.text =
                          "${alert.condition} ${formatPrice(alert.target)}"


                      description.textSize =
                          18f


                      description.setTextColor(
                          Color.BLACK
                      )


                      row.addView(
                          description
                      )


                      val status =
                          TextView(this)


                      if (
                          alert.triggered
                      ) {

                          status.text =
                              "Triggered at ${formatPrice(alert.triggeredPrice)}\n" +
                              formatTime(
                                  alert.triggeredTime
                              )


                          status.setTextColor(
                              Color.rgb(
                                  0,
                                  140,
                                  0
                              )
                          )

                      } else {

                          status.text =
                              if (
                                  alert.enabled
                              )
                                  "Enabled"
                              else
                                  "Disabled"


                          status.setTextColor(
                              if (
                                  alert.enabled
                              )
                                  Color.rgb(
                                      0,
                                      140,
                                      0
                                  )
                              else
                                  Color.GRAY
                          )
                      }


                      row.addView(
                          status
                      )


                      val buttons =
                          LinearLayout(this)


                      buttons.orientation =
                          LinearLayout.HORIZONTAL


                      if (
                          alert.triggered
                      ) {

                          val reset =
                              Button(this)


                          reset.text =
                              "RESET"


                          reset.setOnClickListener {

                              alert.triggered =
                                  false


                              alert.triggeredPrice =
                                  Double.NaN


                              alert.triggeredTime =
                                  0L


                              alert.enabled =
                                  true


                              saveAlerts()

                              refreshAlertList()
                          }


                          buttons.addView(
                              reset,
                              LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1f
                              )
                          )

                      } else {

                          val toggle =
                              Button(this)


                          toggle.text =
                              if (
                                  alert.enabled
                              )
                                  "DISABLE"
                              else
                                  "ENABLE"


                          toggle.setOnClickListener {

                              alert.enabled =
                                  !alert.enabled


                              saveAlerts()

                              refreshAlertList()
                          }


                          buttons.addView(
                              toggle,
                              LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1f
                              )
                          )
                      }


                      val delete =
                          Button(this)


                      delete.text =
                          "DELETE"


                      delete.setOnClickListener {

                          alerts.removeAll {
                              it.id ==
                                  alert.id
                          }


                          saveAlerts()

                          refreshAlertList()
                      }


                      buttons.addView(
                          delete,
                          LinearLayout.LayoutParams(
                              0,
                              -2,
                              1f
                          )
                      )


                      row.addView(
                          buttons
                      )


                      alertContainer.addView(
                          row
                      )
                  }
              }


              private fun refreshHistoryList() {

                  if (
                      !::historyContainer
                          .isInitialized
                  ) {
                      return
                  }


                  historyContainer
                      .removeAllViews()


                  val current =
                      history.filter {
                          it.symbol ==
                              currentSymbol
                      }.sortedByDescending {
                          it.triggeredTime
                      }


                  if (
                      current.isEmpty()
                  ) {

                      val empty =
                          TextView(this)


                      empty.text =
                          "No triggered alerts"


                      empty.textSize =
                          16f


                      empty.setTextColor(
                          Color.GRAY
                      )


                      historyContainer.addView(
                          empty
                      )


                      return
                  }


                  for (
                      item in current
                  ) {

                      val text =
                          TextView(this)


                      text.text =
                          "${displaySymbol(item.symbol)}\n" +
                          "${item.condition} ${formatPrice(item.target)}\n" +
                          "Triggered price: ${formatPrice(item.triggeredPrice)}\n" +
                          formatTime(
                              item.triggeredTime
                          )


                      text.textSize =
                          15f


                      text.setTextColor(
                          Color.DKGRAY
                      )


                      text.setPadding(
                          12,
                          12,
                          12,
                          18
                      )


                      historyContainer.addView(
                          text
                      )
                  }
              }


              private fun saveAlerts() {

                  try {

                      val array =
                          JSONArray()


                      for (
                          alert in alerts
                      ) {

                          val item =
                              JSONObject()


                          item.put(
                              "id",
                              alert.id
                          )


                          item.put(
                              "symbol",
                              alert.symbol
                          )


                          item.put(
                              "condition",
                              alert.condition
                          )


                          item.put(
                              "target",
                              alert.target
                          )


                          item.put(
                              "enabled",
                              alert.enabled
                          )


                          item.put(
                              "triggered",
                              alert.triggered
                          )


                          if (
                              alert.triggeredPrice
                                  .isFinite()
                          ) {

                              item.put(
                                  "triggeredPrice",
                                  alert.triggeredPrice
                              )

                          } else {

                              item.put(
                                  "triggeredPrice",
                                  JSONObject.NULL
                              )
                          }


                          item.put(
                              "triggeredTime",
                              alert.triggeredTime
                          )


                          array.put(
                              item
                          )
                      }


                      preferences.edit()

                          .putString(
                              "alerts",
                              array.toString()
                          )

                          .apply()

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun loadAlerts() {

                  alerts.clear()


                  val saved =
                      preferences.getString(
                          "alerts",
                          null
                      ) ?: return


                  try {

                      val array =
                          JSONArray(saved)


                      for (
                          i in 0 until array.length()
                      ) {

                          val item =
                              array.getJSONObject(
                                  i
                              )


                          val triggeredPrice =
                              if (
                                  item.has(
                                      "triggeredPrice"
                                  ) &&
                                  !item.isNull(
                                      "triggeredPrice"
                                  )
                              ) {

                                  item.optDouble(
                                      "triggeredPrice",
                                      Double.NaN
                                  )

                              } else {

                                  Double.NaN
                              }


                          alerts.add(

                              PriceAlert(

                                  id =
                                      item.getLong(
                                          "id"
                                      ),

                                  symbol =
                                      item.getString(
                                          "symbol"
                                      ),

                                  condition =
                                      item.getString(
                                          "condition"
                                      ),

                                  target =
                                      item.getDouble(
                                          "target"
                                      ),

                                  enabled =
                                      item.getBoolean(
                                          "enabled"
                                      ),

                                  triggered =
                                      item.getBoolean(
                                          "triggered"
                                      ),

                                  triggeredPrice =
                                      triggeredPrice,

                                  triggeredTime =
                                      item.optLong(
                                          "triggeredTime",
                                          0L
                                      )
                              )
                          )
                      }

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun saveHistory() {

                  try {

                      val array =
                          JSONArray()


                      for (
                          item in history
                      ) {

                          if (
                              !item.triggeredPrice
                                  .isFinite()
                          ) {
                              continue
                          }


                          val objectItem =
                              JSONObject()


                          objectItem.put(
                              "id",
                              item.id
                          )


                          objectItem.put(
                              "symbol",
                              item.symbol
                          )


                          objectItem.put(
                              "condition",
                              item.condition
                          )


                          objectItem.put(
                              "target",
                              item.target
                          )


                          objectItem.put(
                              "triggeredPrice",
                              item.triggeredPrice
                          )


                          objectItem.put(
                              "triggeredTime",
                              item.triggeredTime
                          )


                          array.put(
                              objectItem
                          )
                      }


                      preferences.edit()

                          .putString(
                              "history",
                              array.toString()
                          )

                          .apply()

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun loadHistory() {

                  history.clear()


                  val saved =
                      preferences.getString(
                          "history",
                          null
                      ) ?: return


                  try {

                      val array =
                          JSONArray(saved)


                      for (
                          i in 0 until array.length()
                      ) {

                          val item =
                              array.getJSONObject(
                                  i
                              )


                          val price =
                              item.optDouble(
                                  "triggeredPrice",
                                  Double.NaN
                              )


                          if (
                              !price.isFinite()
                          ) {
                              continue
                          }


                          history.add(

                              AlertHistory(

                                  id =
                                      item.getLong(
                                          "id"
                                      ),

                                  symbol =
                                      item.getString(
                                          "symbol"
                                      ),

                                  condition =
                                      item.getString(
                                          "condition"
                                      ),

                                  target =
                                      item.getDouble(
                                          "target"
                                      ),

                                  triggeredPrice =
                                      price,

                                  triggeredTime =
                                      item.getLong(
                                          "triggeredTime"
                                      )
                              )
                          )
                      }

                  } catch (
                      _: Exception
                  ) {
                  }
              }


              private fun requestNotificationPermission() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      if (
                          checkSelfPermission(
                              Manifest.permission.POST_NOTIFICATIONS
                          ) !=
                          PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                              arrayOf(
                                  Manifest.permission.POST_NOTIFICATIONS
                              ),
                              100
                          )
                      }
                  }
              }


              private fun displaySymbol(
                  symbol: String
              ): String {

                  return symbols.entries

                      .firstOrNull {
                          it.value ==
                              symbol
                      }

                      ?.key

                      ?: symbol
              }


              private fun formatPrice(
                  price: Double
              ): String {

                  return if (
                      currentSymbol.contains(
                          "JPY"
                      )
                  ) {

                      String.format(
                          Locale.US,
                          "%.3f",
                          price
                      )

                  } else {

                      String.format(
                          Locale.US,
                          "%.5f",
                          price
                      )
                  }
              }


              private fun formatTime(
                  time: Long
              ): String {

                  if (
                      time <= 0
                  ) {
                      return ""
                  }


                  return SimpleDateFormat(
                      "dd MMM yyyy, HH:mm:ss",
                      Locale.getDefault()
                  ).format(
                      Date(time)
                  )
              }
          }
